  zipkin:
    image: ghcr.io/openzipkin/zipkin:${TAG:-latest}
    container_name: zipkin
    environment:
      - STORAGE_TYPE=mem
#      - MYSQL_HOST=mysql
      - ZIPKIN_QUERY_ALLOWED_ORIGINS=*
    ports:
      - "9411:9411"

  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_DB=veterinars_db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    ports:
      - '5432:5432'

